<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="pulseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)" />
  
  <!-- Inner Glow Ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="6" />

  <!-- Heart Background with Glow -->
  <path d="M256 420 C180 350, 100 280, 100 190 C100 130, 145 90, 205 90 C238 90, 250 110, 256 122 C262 110, 274 90, 307 90 C367 90, 412 130, 412 190 C412 280, 332 350, 256 420 Z" 
        fill="rgba(255, 255, 255, 0.15)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="12" stroke-linejoin="round" />

  <!-- Pulse Line (ECG) -->
  <path d="M120 256 L180 256 L210 200 L240 310 L270 170 L300 290 L330 256 L392 256" 
        fill="none" stroke="url(#pulseGradient)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Medical Cross Badge Top Right -->
  <circle cx="390" cy="120" r="48" fill="#10b981" />
  <circle cx="390" cy="120" r="48" fill="none" stroke="#ffffff" stroke-width="6" />
  <path d="M390 94 L390 146 M364 120 L416 120" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
</svg>
